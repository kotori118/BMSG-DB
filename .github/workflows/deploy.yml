name: Deploy to GAS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate GAS sources
        run: node scripts/validate-gas-sources.mjs

      - name: Run source contract tests
        run: node --test tests/source-contract.test.mjs

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Create clasprc.json
        run: echo '${{ secrets.CLASPRC_JSON_KEY }}' > ~/.clasprc.json

      - name: Create clasp project binding
        run: echo '{"scriptId":"1NiJ94p1UVFGxd3DrNXz0x3MFC1haPopa11LQy593-3ft4exsoJM4huwZ","rootDir":"."}' > .clasp.json

      - name: Push to GAS
        run: clasp push -f

      - name: Create library version
        id: library_version
        shell: bash
        run: |
          output="$(clasp version "BMSG Universe shared writer $GITHUB_SHA")"
          echo "$output"
          version="$(echo "$output" | sed -n 's/.*Created version \([0-9][0-9]*\).*/\1/p')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish BMSG-PJ handoff summary
        shell: bash
        run: |
          {
            echo "## BMSGDB library handoff"
            echo "- Created library version: ${{ steps.library_version.outputs.version }}"
            echo "- BMSG-PJ must pin this version in appsscript.json and deploy before the new writer is used."
          } >> "$GITHUB_STEP_SUMMARY"
