name: One-shot shared writer refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-writer-refactor.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Route legacy Guest registration through shared writer
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_function(text, name, replacement):
              start=text.find(f'function {name}(')
              if start<0: raise SystemExit(f'function not found: {name}')
              brace=text.find('{',start); depth=0; quote=None; esc=False; line=False; block=False; i=brace
              while i<len(text):
                  c=text[i]; n=text[i+1] if i+1<len(text) else ''
                  if line:
                      if c=='\n': line=False
                  elif block:
                      if c=='*' and n=='/': block=False; i+=1
                  elif quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                  else:
                      if c=='/' and n=='/': line=True; i+=1
                      elif c=='/' and n=='*': block=True; i+=1
                      elif c in ('\"',"'",'`'): quote=c
                      elif c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0: return text[:start]+replacement.rstrip()+'\n'+text[i+1:]
                  i+=1
              raise SystemExit('unclosed function')

          p=Path('Lyrics.gs'); text=p.read_text()
          text=replace_function(text,'confirmAndRegisterLyricsGuests_',r'''function confirmAndRegisterLyricsGuests_(ss, names) {
            const result = { registered: [], ignored: [] };
            if (!names.length) return result;
            names.forEach(function(name) {
              const yes = confirm_(
                '未登録Guest候補',
                '歌唱者候補「' + name + '」は02_Members／03_Guestsに未登録です。\n\n' +
                '［はい］Guestとして03_Guestsへ登録し、この行を歌唱者の区切りとして扱う\n' +
                '［いいえ］Guestではない。この行は区切らずLyrics本文として残す'
              );
              if (!yes) { result.ignored.push(name); return; }
              const saved = withSharedWriterLock_('Guest登録', function() {
                return registerGuestCore_(ss, name, {source:'BMSG-DB_LEGACY',notePrefix:'Spreadsheet 歌詞解析 Guest登録'});
              });
              if (saved && saved.ok) result.registered.push(name);
            });
            return result;
          }''')
          p.write_text(text)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Lyrics.gs
          git diff --cached --check
          git commit -m 'Route legacy Guest registration through shared writer'
          git push
